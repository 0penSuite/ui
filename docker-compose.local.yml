name: opensuite-ui

services:
  # Catalogue de la charte (dev hot-reload)
  nuxt-dev:
    image: node:26.12.1
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    tty: true
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
    volumes:
      - .:/app
      # Préserver node_modules dans le conteneur, pas sur l'hôte
      - /app/node_modules
    ports:
      - "${PLAYGROUND_PORT:-3001}:3000"
